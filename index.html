<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WK Coach">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="description" content="Big-man in-season training system — Wen Kang">
<title>WK Coach v2 — Big-Man In-Season System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#141820;      /* night-court base */
  --paint:#1B2330;        /* painted key / panels */
  --paint-2:#232D3D;      /* raised panel */
  --line:#39465A;         /* court line, borders */
  --chalk:#EDEDE6;        /* primary text */
  --ink:#8A93A6;          /* muted captions */
  --ball:#FF7A2F;         /* accent — basketball leather */
  --ball-dim:#B5581F;
  --green:#4CC38A; --amber:#E9B44C; --red:#E5484D;
  --r:14px;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--asphalt);color:var(--chalk);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:.95rem;line-height:1.45;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);
  min-height:100vh;
}
.disp{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{font-weight:700}
a{color:var(--ball)}

/* ---------- scoreboard header (signature) ---------- */
#scoreB{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#10141B 0%,var(--asphalt) 100%);
  border-bottom:2px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 14px 10px;
}
#scoreB .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#scoreB .app{font-family:'Barlow Condensed';font-weight:700;font-size:1.05rem;
  text-transform:uppercase;letter-spacing:.12em;color:var(--ink)}
#scoreB .app b{color:var(--ball)}
#scoreB .date{font-family:'Barlow Condensed';font-weight:600;font-size:.95rem;color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
#scoreB .row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px}
#scoreB .assign{font-family:'Barlow Condensed';font-weight:700;font-size:1.5rem;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
#scoreB .assign small{display:block;font-family:'Barlow';font-weight:500;font-size:.72rem;letter-spacing:.04em;color:var(--ink);text-transform:none;margin-top:2px}
#scoreB .tip{text-align:right;min-width:96px}
#scoreB .tip .t1{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink)}
#scoreB .tip .t2{font-family:'Barlow Condensed';font-weight:700;font-size:1.25rem;color:var(--ball)}
#scoreB .chalkline{height:3px;margin-top:8px;background:
  repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 22px);border-radius:2px}
.gamehdr #scoreB .assign{color:var(--ball)}

/* ---------- layout ---------- */
main{padding:14px 14px 8px;max-width:640px;margin:0 auto}
.card{background:var(--paint);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px}
.card.raised{background:var(--paint-2)}
.card h2{font-family:'Barlow Condensed';font-size:1.15rem;text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h2 .dotp{width:8px;height:8px;border-radius:50%;background:var(--ball);flex:0 0 auto}
.sub{color:var(--ink);font-size:.82rem}
.hr{height:1px;background:var(--line);margin:10px 0;border:none}
.chip{display:inline-block;padding:2px 9px;border:1px solid var(--line);border-radius:999px;
  font-size:.72rem;color:var(--ink);text-transform:uppercase;letter-spacing:.08em}
.chip.on{border-color:var(--ball);color:var(--ball)}
.badge{display:inline-block;font-family:'Barlow Condensed';font-weight:700;font-size:.8rem;
  padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.06em}
.b-green{background:rgba(76,195,138,.15);color:var(--green);border:1px solid var(--green)}
.b-amber{background:rgba(233,180,76,.15);color:var(--amber);border:1px solid var(--amber)}
.b-red{background:rgba(229,72,77,.15);color:var(--red);border:1px solid var(--red)}
.b-ball{background:rgba(255,122,47,.12);color:var(--ball);border:1px solid var(--ball)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--paint-2);font-weight:600;font-size:.9rem}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ball);border-color:var(--ball);color:#16100B}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:.82rem;border-radius:10px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- bottom nav ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:#10141B;border-top:1px solid var(--line);
  display:flex}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--ink);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
#tabs button .ic{font-family:'Barlow Condensed';font-weight:700;font-size:1.15rem;line-height:1}
#tabs button.on{color:var(--ball)}
#tabs button:focus-visible{outline:2px solid var(--ball);outline-offset:-2px;border-radius:8px}

/* ---------- readiness gate ---------- */
.gate .g-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.g-cell{background:var(--asphalt);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.g-cell label{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);margin-bottom:4px}
.g-cell .val{font-family:'Barlow Condensed';font-weight:700;font-size:1.6rem}
.g-cell .step{display:flex;justify-content:center;gap:10px;margin-top:4px}
.g-cell .step button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;
  font-size:1.1rem;font-weight:700;background:var(--paint-2)}
.g-verdict{border-radius:12px;padding:10px 12px;margin-top:6px;font-weight:600}
.g-verdict.green{background:rgba(76,195,138,.12);border:1px solid var(--green)}
.g-verdict.amber{background:rgba(233,180,76,.12);border:1px solid var(--amber)}
.g-verdict.red{background:rgba(229,72,77,.12);border:1px solid var(--red)}
.g-verdict .vt{font-family:'Barlow Condensed';font-size:1.1rem;text-transform:uppercase;letter-spacing:.08em}
.g-lights{display:flex;gap:6px;margin-left:auto}
.g-lights span{width:12px;height:12px;border-radius:50%;background:var(--line)}
.g-lights.green span:nth-child(1){background:var(--green)}
.g-lights.amber span:nth-child(2){background:var(--amber)}
.g-lights.red span:nth-child(3){background:var(--red)}

/* ---------- session / exercise ---------- */
.ss-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.ss-head .t{font-family:'Barlow Condensed';font-weight:700;font-size:1.4rem;text-transform:uppercase;letter-spacing:.04em}
.grp{border-left:3px solid var(--ball-dim);padding-left:10px;margin:14px 0}
.grp.plain{border-left-color:var(--line)}
.grp .gt{font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ball);
  font-weight:700;margin-bottom:6px}
.grp.plain .gt{color:var(--ink)}
.ex{background:var(--asphalt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ex .xh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex .xn{font-weight:700}
.ex .xt{font-family:'Barlow Condensed';font-weight:600;color:var(--ball);white-space:nowrap}
.ex .cue{color:var(--ink);font-size:.8rem;margin-top:2px}
.ex .sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:4px}
.setchip{background:var(--paint-2);border:1px solid var(--line);border-radius:8px;
  padding:3px 8px;font-size:.8rem;font-weight:600}
.setchip b{color:var(--ball)}
.logrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.stp{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paint-2)}
.stp button{width:38px;height:40px;font-size:1.05rem;font-weight:700;color:var(--ink)}
.stp .v{min-width:56px;text-align:center;font-weight:700;font-family:'Barlow Condensed';font-size:1.1rem}
.stp .u{font-size:.62rem;color:var(--ink);margin-right:6px}
.donebar{display:flex;align-items:center;gap:8px;margin-top:6px}
.chk{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:transparent}
.chk.on{background:var(--green);border-color:var(--green);color:#0E1A14}
.drill{display:flex;gap:10px;align-items:flex-start;background:var(--asphalt);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:8px}
.drill .dn{font-weight:700}
.drill .dv{font-family:'Barlow Condensed';color:var(--ball);font-weight:600}
.drill .cue{color:var(--ink);font-size:.8rem}
.warm{background:rgba(255,122,47,.06);border:1px dashed var(--ball-dim);border-radius:12px;
  padding:10px 12px;margin-bottom:12px;font-size:.86rem}
.warm b{color:var(--ball)}
.note{font-size:.8rem;color:var(--ink);margin-top:8px}
.alertbar{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.86rem;font-weight:600}
.alertbar.red{background:rgba(229,72,77,.12);border:1px solid var(--red)}
.alertbar.amber{background:rgba(233,180,76,.12);border:1px solid var(--amber)}

/* ---------- calendar ---------- */
.cal{display:flex;flex-direction:column;gap:6px}
.cal .day{display:flex;gap:10px;align-items:center;background:var(--asphalt);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cal .day.today{border-color:var(--ball);box-shadow:0 0 0 1px var(--ball)}
.cal .day.game{background:rgba(255,122,47,.08)}
.cal .dd{font-family:'Barlow Condensed';font-weight:700;width:52px;text-align:center;line-height:1.05}
.cal .dd .dnum{font-size:1.15rem}
.cal .dd .dw{font-size:.6rem;color:var(--ink);text-transform:uppercase;letter-spacing:.1em}
.cal .dl{flex:1}
.cal .dl .t{font-weight:700;font-size:.9rem}
.cal .dl .s{color:var(--ink);font-size:.76rem}
.cal .done{color:var(--green);font-weight:800}

/* ---------- protocol timeline ---------- */
.tl{position:relative;margin-left:6px}
.tl .ti{display:flex;gap:12px;padding:8px 0;border-left:2px solid var(--line);position:relative;padding-left:16px}
.tl .ti::before{content:'';position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;
  background:var(--paint-2);border:2px solid var(--line)}
.tl .ti.done::before{background:var(--green);border-color:var(--green)}
.tl .tt{min-width:72px;font-family:'Barlow Condensed';font-weight:700;color:var(--ball)}
.tl .tt small{display:block;color:var(--ink);font-family:'Barlow';font-weight:500;font-size:.68rem}
.tl .tx{flex:1;font-size:.88rem}
.tl .ti button.tchk{margin-left:auto}

/* ---------- track ---------- */
.metricrow{display:flex;gap:10px;align-items:center}
.metricrow input[type=number]{width:90px;background:var(--asphalt);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;font-weight:700;font-family:'Barlow Condensed';font-size:1.05rem;text-align:center}
input[type=text]{background:var(--asphalt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--ball);outline-offset:1px}
.spark{width:100%;height:84px;display:block;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);
  text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid rgba(57,70,90,.4)}
.tbl td.r,.tbl th.r{text-align:right}
.counter{display:flex;justify-content:space-between;align-items:center;background:var(--asphalt);
  border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.counter .cn{font-weight:600;font-size:.88rem}
.counter .cv{font-family:'Barlow Condensed';font-weight:700;font-size:1.5rem;min-width:36px;text-align:center}

/* ---------- playbook accordions ---------- */
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--paint)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;font-family:'Barlow Condensed';font-weight:700;font-size:1.02rem;
  text-transform:uppercase;letter-spacing:.06em;text-align:left}
.acc>button .car{color:var(--ball);transition:transform .18s}
.acc.open>button .car{transform:rotate(90deg)}
.acc .body{display:none;padding:0 14px 14px;font-size:.88rem}
.acc.open .body{display:block}
.body table{margin:8px 0}
.body ul{padding-left:18px;margin:6px 0}
.body li{margin:3px 0}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.78rem;
  background:var(--asphalt);border:1px solid var(--line);border-radius:10px;
  padding:10px;white-space:pre;overflow-x:auto;line-height:1.5;margin:8px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(57,70,90,.35);font-size:.86rem}
.kv b{text-align:right}

/* ---------- rest timer sheet ---------- */
#timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  z-index:45;background:#10141B;border-top:2px solid var(--ball);
  padding:10px 16px;display:none;align-items:center;gap:14px}
#timer.on{display:flex}
#timer .tv{font-family:'Barlow Condensed';font-weight:700;font-size:2.2rem;min-width:96px;color:var(--ball)}
#timer .tl2{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink)}
#timer .tbtns{margin-left:auto;display:flex;gap:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#timer.zero .tv{animation:pulse .8s infinite;color:var(--green)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);z-index:60;
  background:var(--paint-2);border:1px solid var(--ball);color:var(--chalk);
  border-radius:999px;padding:8px 16px;font-size:.82rem;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

.fixture{display:flex;gap:10px;align-items:center;background:var(--asphalt);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:8px}
.fixture.play{border-color:var(--ball-dim)}
.fixture .fd{font-family:'Barlow Condensed';font-weight:700;width:56px;text-align:center;line-height:1.1}
.fixture .fi{flex:1}
.fixture .fi .ft{font-weight:700;font-size:.9rem}
.fixture .fi .fs{color:var(--ink);font-size:.76rem}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:10px 4px;font-family:'Barlow Condensed';font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;font-size:.9rem;color:var(--ink);background:var(--paint)}
.seg button.on{background:var(--ball);color:#16100B}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="scoreB">
  <svg class="wm" viewBox="0 0 220 110" aria-hidden="true"><path d="M30 110V55a12 12 0 0 1 12-12h136a12 12 0 0 1 12 12v55"/><circle cx="110" cy="110" r="52"/><circle cx="110" cy="110" r="18"/><path d="M-4 110C20 30 200 30 224 110"/></svg>
  <div class="row1"><div class="app">WK <b>COACH</b> · FINAL</div><div class="date" id="hDate"></div></div>
  <div class="row2">
    <div class="assign" id="hAssign">—<small id="hAssignSub"></small></div>
    <div class="tip"><div class="t1" id="hTipL">NEXT TIP</div><div class="t2 num" id="hTip">—</div></div>
  </div>
  <div class="chalkline"></div>
</header>
<main id="view"></main>
<div id="timer" role="timer">
  <div><div class="tl2">REST</div><div class="tv num" id="tv">1:30</div></div>
  <div class="tbtns">
    <button class="btn small" data-t="60">60</button>
    <button class="btn small" data-t="90">90</button>
    <button class="btn small" data-t="120">120</button>
    <button class="btn small ghost" id="tX">✕</button>
  </div>
</div>
<nav id="tabs" aria-label="Sections">
  <button data-tab="today" class="on"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3.5 2.5-3.5 15.5 0 18M12 3c3.5 2.5 3.5 15.5 0 18"/></svg></span>Today</button>
  <button data-tab="train"><span class="ic"><svg viewBox="0 0 24 24"><path d="M2.5 12h2m15 0h2M7 8.5v7M17 8.5v7M9.5 6v12M14.5 6v12M9.5 12h5"/></svg></span>Train</button>
  <button data-tab="game"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5M12 2.5v3.5M18.5 7l1.5-1.5"/></svg></span>Game</button>
  <button data-tab="track"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3.5 20.5h17M5 16.5l4.5-5.5 3 3 6-7.5"/><circle cx="18.5" cy="6.5" r="1.2"/></svg></span>Track</button>
  <button data-tab="book"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5.5 4.5h13v15h-11a2 2 0 0 1-2-2zM5.5 4.5v13M9 8.5h6M9 12h6"/></svg></span>Playbook</button>
</nav>
<div id="toast"></div>
<script>
/* ================= DATA LAYER ================= */
const START='2026-07-05';               // app epoch (Game 1)
const PHASE3='2026-07-23';              // Build phase begins
const TRANS_END='2026-07-22';

/* --- Exercise library: n=name, t=target, kg=start per-hand (null=BW), cue --- */
const EX={
 /* Strength A */
 plyoSJ:{n:'Squat Jump',t:'3×3',kg:null,cue:'Full intent, stick landing 1s, absorb through hips. Court-1 weeks only.'},
 plyoPG:{n:'Pogo Hops',t:'2×5',kg:null,cue:'Stiff ankle, quick ground contact, quiet feet.'},
 gsq:{n:'Goblet / Front-Rack Squat',t:'4×8–10 @3-1-1',kg:24,cue:'Chest up, 3s down, 1s pause. Goblet caps → 2 DB front-rack.'},
 calfS:{n:'Straight-Knee Calf Raise',t:'3×15',kg:22,cue:'Full ROM, 1s pause at top. Gastroc.'},
 bss:{n:'Bulgarian Split Squat',t:'3×8 /leg',kg:12,cue:'Rear foot on chair (check it can\u2019t slide). #1 leg builder.'},
 tib:{n:'Tibialis Raise',t:'3×15–20',kg:null,cue:'Wall-supported. Shin armour for concrete landings.'},
 rdl:{n:'DB Romanian Deadlift',t:'3×10',kg:22,cue:'Hinge, flat back, hams/glutes load — not lower back.'},
 sidepl:{n:'Side Plank',t:'3×30–45s /side',kg:null,cue:'Anti-lateral-flexion = your sealing core.'},
 flg:{n:'Forward / Reverse Lunge',t:'2×8 /leg',kg:14,cue:'Long step, control down, drive back tall. Knee-sensitive → reverse.'},
 /* Strength B */
 rlg:{n:'DB Reverse Lunge',t:'2×8–10 /leg',kg:14,cue:'Stay tall, knee-friendly pattern.'},
 fpress:{n:'DB Floor Press',t:'3×8–10',kg:20,cue:'Push power → finishing through contact.'},
 slrdl:{n:'Single-Leg RDL',t:'2×8 /leg',kg:12,cue:'Slow, balanced. Hip stability + hamstring.'},
 row:{n:'DB 1-Arm Row',t:'3×10 /arm',kg:25,cue:'Brace on chair, no torso swing. Rebound pull.'},
 latlg:{n:'DB Lateral Lunge',t:'2×8 /side',kg:10,cue:'Builds the defensive slide. Sit into the hip.'},
 ohp:{n:'DB Shoulder Press',t:'3×8–10',kg:16,cue:'Finish high, contest verticality.'},
 bridge:{n:'B-Stance Glute Bridge',t:'2×10 /leg',kg:27,cue:'DB on hips (pad it). Hard glute squeeze at top.'},

function wwFor(id){return st.ww[id]!=null?st.ww[id]:EX[id].kg;}
function repDef(t){const m=t.match(/×\s*(\d+)/);return m?+m[1]:8;}
function getLog(ds,sid){let l=st.logs.find(x=>x.d===ds&&x.s===sid);if(!l){l={d:ds,s:sid,ex:{},dr:{},done:false};st.logs.push(l);}return l;}
function verdict(g){if(g.sleep==null)return null;const trg=(g.sleep<6?1:0)+(g.sore>=4?1:0)+(g.stiff>=4?1:0);
  if(g.stiff>=6||trg>=2)return'red';if(trg===1)return'amber';return'green';}
const VTXT={green:['GREEN — run as written','Full session. In-season loads, 2–3 RIR.'],
 amber:['AMBER — downgrade','Heavy → moderate (RIR 4) · skip plyo · court = skills only.'],
 red:['RED — protect the block','Rest or skills-only. No heavy, no jumps. One protected day beats a lost week.']};
function todayGate(){const d=todayStr();let g=st.gate.find(x=>x.d===d);if(!g){g={d,sleep:7,sore:2,stiff:1,touched:false};st.gate.push(g);}return g;}
function p4Alert(){const gs=st.gate.filter(g=>g.touched).slice(-3);if(gs.length<3)return null;
  if(gs[2].stiff-gs[0].stiff>=2&&gs[2].stiff>=gs[1].stiff)return'P4 TENDON ALERT: AM stiffness rising 3 mornings — cut jump volume 50% this week (plyo halved, tip-drill 3×30s → 2×20s), even if pain-free in play.';return null;}
function d8Today(){return st.done8.includes(todayStr());}

/* ---- header ---- */
function renderHead(){const ds=todayStr(),a=assignFor(ds),d=parseL(ds);
  document.getElementById('hDate').textContent=DW[d.getDay()]+' · '+d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear();
  document.getElementById('hAssign').innerHTML=esc(a.t)+'<small>'+esc(a.s)+'</small>';
  document.body.classList.toggle('gamehdr',a.k==='GAME');
  const nt=nextTip(),L=document.getElementById('hTipL'),V=document.getElementById('hTip');
  if(!nt){L.textContent='BLOCK';V.textContent=ds>TRANS_END?'BUILD':'DONE';return;}
  const now=new Date(),ms=nt.t-now;
  if(ms<=0&&ms>-110*60000){L.textContent='NOW';V.textContent='LIVE';return;}
  L.textContent='NEXT TIP · '+(nt.f.d===ds?'TODAY':fmtShort(nt.f.d).slice(0,10));
  if(ms<36e5*20){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);V.textContent='T−'+h+'H'+P2(m);}
  else V.textContent=clock(nt.t);
}

/* ---- gate card ---- */
function gateCard(){const g=todayGate(),v=g.touched?verdict(g):null;
  const cell=(k,lab,max)=>`<div class="g-cell"><label>${lab}</label><div class="val num" id="gv-${k}">${g[k]}</div>
   <div class="step"><button data-g="${k}" data-d="-1">−</button><button data-g="${k}" data-d="1">+</button></div></div>`;
  return `<div class="card gate"><h2><span class="dotp"></span>Morning Gate
   <span class="g-lights ${v||''}"><span></span><span></span><span></span></span></h2>
   <div class="g-inputs">${cell('sleep','Sleep h',12)}${cell('sore','Soreness /10',10)}${cell('stiff','Achilles AM /10',10)}</div>
   ${v?`<div class="g-verdict ${v}"><div class="vt">${VTXT[v][0]}</div><div class="sub" style="color:inherit;opacity:.85">${VTXT[v][1]}</div></div>`
      :'<div class="sub">Set the three numbers — verdict appears and gates today\u2019s session.</div>'}</div>`;
}
function bindGate(){document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=todayGate(),k=b.dataset.g,d=+b.dataset.d;
  const lim=k==='sleep'?[0,12]:[0,10];g[k]=Math.min(lim[1],Math.max(lim[0],g[k]+d));g.touched=true;save('Gate saved');render();});}

/* ---- TODAY ---- */
function vToday(){const ds=todayStr(),a=assignFor(ds),fx=fixOn(ds),p4=p4Alert();
  const g=todayGate(),v=g.touched?verdict(g):null;
  let cta='';
  if(a.k==='GAME'&&fx)cta=`<button class="btn primary block" data-go="proto" data-p="${fx.proto}">Open Protocol ${fx.proto} · tip ${clock(parseL(fx.d,fx.tip))}</button>`;
  else if(SESSIONS[a.k])cta=`<button class="btn primary block" data-go="sess" data-s="${a.k}">Start ${SESSIONS[a.k].title.split(' — ')[0]}</button>`;
  else if(a.k==='FLOAT')cta=`<div class="btnrow"><button class="btn" data-go="sess" data-s="C1">Court 1</button><button class="btn" data-go="sess" data-s="C2">Court 2</button><button class="btn ghost" data-go="sess" data-s="MOB">Mobility</button></div>`;
  else if(a.k==='REC'||a.k==='MOB'||a.k==='TRANS')cta=`<button class="btn block" data-go="sess" data-s="MOB">Open Mobility</button>`;
  const gameNote=(v&&v!=='green'&&SESSIONS[a.k])?`<div class="alertbar ${v==='red'?'red':'amber'}">${VTXT[v][1]}</div>`:'';
  return `${p4?`<div class="alertbar red">${p4}</div>`:''}
  ${gateCard()}
  <div class="card raised"><h2><span class="dotp"></span>Today\u2019s Assignment</h2>
    <div class="disp" style="font-size:1.3rem;font-weight:700;text-transform:uppercase">${esc(a.t)}</div>
    <div class="sub" style="margin:4px 0 10px">${esc(a.s)}</div>${gameNote}${cta}</div>
  <div class="card"><h2><span class="dotp"></span>Daily-8 Ankle/Core</h2>
    <div class="donebar"><button class="chk ${d8Today()?'on':''}" id="d8chk">✓</button>
    <span class="sub">8 min · injury insurance · 3–5×/wk ${d8Today()?'· <b style=&quot;color:var(--green)&quot;>done today</b>':''}</span>
    <button class="btn small ghost" data-go="sess" data-s="D8" style="margin-left:auto">Open</button></div></div>
  <div class="card"><h2><span class="dotp"></span>Quick Log — Bodyweight</h2>
    <div class="metricrow"><input type="number" step="0.1" id="bwIn" placeholder="91.5" inputmode="decimal">
    <span class="sub">kg · band 91–94</span><button class="btn small" id="bwGo" style="margin-left:auto">Log</button></div></div>`;
}
function bindToday(){bindGate();
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='sess'){app.tab='train';app.sess=b.dataset.s;}else{app.tab='game';app.proto=b.dataset.p;}render();});
  const c=document.getElementById('d8chk');if(c)c.onclick=()=>{const d=todayStr();const i=st.done8.indexOf(d);i>=0?st.done8.splice(i,1):st.done8.push(d);save('Daily-8 '+(i>=0?'unchecked':'done'));render();};
  const bg=document.getElementById('bwGo');if(bg)bg.onclick=()=>{const v=parseFloat(document.getElementById('bwIn').value);if(!v||v<60||v>140)return toast('Enter a real kg value');
    st.bw=st.bw.filter(x=>x.d!==todayStr());st.bw.push({d:todayStr(),kg:v});st.bw.sort((a,b)=>a.d<b.d?-1:1);save('Weight logged');render();};}

/* ---- TRAIN ---- */
function vTrainList(){const cards=['A','B','C1','C2','MOB','D8'].map(k=>{const s=SESSIONS[k];
  return `<div class="card"><div class="ss-head"><div class="t disp">${esc(s.title)}</div></div>
   <div class="sub">${esc(s.time)}</div><button class="btn small primary" data-open="${k}" style="margin-top:10px">Open</button></div>`;}).join('');
  return `<div class="card raised"><h2><span class="dotp"></span>Block Calendar</h2>${calHTML()}</div>${cards}`;
}
function calHTML(){const ds=todayStr();let out='<div class="cal">';
  const days=Object.keys(CAL);for(const d of days){const a=CAL[d],dd=parseL(d);
   const done=st.logs.some(l=>l.d===d&&l.done);
   out+=`<div class="day ${d===ds?'today':''} ${a.k==='GAME'?'game':''}">
    <div class="dd"><div class="dnum num">${dd.getDate()}</div><div class="dw">${DW[dd.getDay()]}</div></div>
    <div class="dl"><div class="t">${esc(a.t)}</div><div class="s">${esc(a.s)}</div></div>
    ${done?'<div class="done">✓</div>':''}</div>`;}
  out+=`</div><p class="sub" style="margin-top:8px">From <b>Jul 23</b> the calendar switches to the BUILD weekly template (see Playbook → Phases).</p>`;return out;}
function vSession(k){const s=SESSIONS[k],ds=todayStr(),log=getLog(ds,k);
  const g=todayGate(),v=g.touched?verdict(g):null;
  let h=`<button class="btn small ghost" id="backT">← Sessions</button>
   <div class="ss-head" style="margin-top:8px"><div class="t disp">${esc(s.title)}</div><span class="chip on">${esc(s.time)}</span></div>
   ${v&&v!=='green'?`<div class="alertbar ${v==='red'?'red':'amber'}">Gate ${v.toUpperCase()}: ${VTXT[v][1]}</div>`:''}
   ${s.warm?`<div class="warm"><b>WARM-UP</b> · ${esc(s.warm)}</div>`:''}`;
  if(s.groups){for(const grp of s.groups){
    h+=`<div class="grp ${grp.plyo?'':''}"><div class="gt">${esc(grp.tag)}</div>`;
    for(const id of grp.items){const e=EX[id],sets=log.ex[id]||[],kg=wwFor(id);
      const chips=sets.map((x,i)=>`<span class="setchip">S${i+1} <b>${x[0]!=null?x[0]+'kg':'BW'}</b>×${x[1]}</span>`).join('');
      const dv=app.draft[id]||(app.draft[id]={kg:kg,r:repDef(e.t)});
      h+=`<div class="ex"><div class="xh"><span class="xn">${esc(e.n)}</span><span class="xt">${esc(e.t)}</span></div>
       <div class="cue">${e.cue}</div><div class="sets">${chips}</div>
       <div class="logrow">${e.kg!=null?`<div class="stp"><button data-st="${id}" data-f="kg" data-d="-1">−</button><span class="v num">${dv.kg}</span><span class="u">kg</span><button data-st="${id}" data-f="kg" data-d="1">+</button></div>`:'<span class="chip">BW</span>'}
       <div class="stp"><button data-st="${id}" data-f="r" data-d="-1">−</button><span class="v num">${dv.r}</span><span class="u">${/s\b|s /.test(e.t)?'s':'reps'}</span><button data-st="${id}" data-f="r" data-d="1">+</button></div>
       <button class="btn small primary" data-log="${id}" style="margin-left:auto">Log set</button></div></div>`;}
    h+='</div>';}}
  if(s.drills){h+='<div class="grp plain"><div class="gt">DRILLS — tap to check</div>';
    s.drills.forEach((d,i)=>{const on=!!log.dr[i];
     h+=`<div class="drill"><button class="chk ${on?'on':''}" data-dr="${i}">✓</button>
      <div><div class="dn">${esc(d[0])} <span class="dv">· ${esc(d[1])}</span></div><div class="cue">${esc(d[2])}</div></div></div>`;});
    h+='</div>';}
  h+=(s.notes||[]).map(n=>`<div class="note">• ${n}</div>`).join('');
  h+=`<button class="btn block ${log.done?'':'primary'}" id="sessDone" style="margin-top:14px">${log.done?'✓ Session complete — tap to reopen':'Mark session complete'}</button>`;
  return h;}
function bindTrain(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{app.sess=b.dataset.open;render();});
  const bk=document.getElementById('backT');if(bk)bk.onclick=()=>{app.sess=null;app.draft={};render();};
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const d=app.draft[b.dataset.st];const f=b.dataset.f,dd=+b.dataset.d;
    d[f]=Math.max(f==='kg'?0:1,d[f]+(f==='kg'?dd*1:dd));render();});
  document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{const id=b.dataset.log,l=getLog(todayStr(),app.sess),d=app.draft[id];
    (l.ex[id]=l.ex[id]||[]).push([EX[id].kg!=null?d.kg:null,d.r]);
    if(EX[id].kg!=null)st.ww[id]=d.kg;save('Set logged');startTimer(90);render();});
  document.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>{const l=getLog(todayStr(),app.sess);l.dr[b.dataset.dr]=!l.dr[b.dataset.dr];save();render();});
  const sd=document.getElementById('sessDone');if(sd)sd.onclick=()=>{const l=getLog(todayStr(),app.sess);l.done=!l.done;save(l.done?'Logged. Recover well.':'Reopened');render();};}

/* ---- GAME ---- */
function vGame(){const ds=todayStr();const pk=app.proto||((fixOn(ds)||{}).proto)||'A';app.proto=pk;
  const fxh=FIX.map(f=>{const dd=parseL(f.d);const play=f.role==='PLAY';
   return `<div class="fixture ${play?'play':''}"><div class="fd"><div class="num" style="font-size:1.1rem">${dd.getDate()}</div><div class="sub" style="font-size:.6rem">${MO[dd.getMonth()]}</div></div>
   <div class="fi"><div class="ft">${play?'🟢 PLAY':'👀 SUPPORT'} · ${esc(f.team)}</div><div class="fs">vs ${esc(f.opp)} · ${clock(parseL(f.d,f.tip))}${f.proto?' · Protocol '+f.proto:''}</div></div></div>`;}).join('');
  const p=PROTO[pk];
  const fx=FIX.find(f=>f.proto===pk);
  const tip=fx?parseL(fx.d,fx.tip):null;
  const ck=st.pchk[pk]||(st.pchk[pk]=[]);
  const tl=p.items.map((it,i)=>{const done=ck.includes(i);
    const when=tip?clock(new Date(tip.getTime()-it[0]*60000)):null;
    const tm=it[0]>=0?('T−'+(it[0]>=60?Math.floor(it[0]/60)+'h'+(it[0]%60?P2(it[0]%60):''):it[0]+'m')):('T+'+Math.abs(it[0])+'m');
    return `<div class="ti ${done?'done':''}"><div class="tt num">${when||tm}<small>${when?tm:''}</small></div>
     <div class="tx">${it[1]}</div><button class="chk tchk ${done?'on':''}" data-pi="${i}">✓</button></div>`;}).join('');
  const goals=GAMEGOALS.map(g=>`<div class="kv"><span>${g[1]}</span><b>${g[2]}</b></div>`).join('');
  const gm=lastPlayGame();
  const counters=GAMEGOALS.map(g=>`<div class="counter"><span class="cn">${g[1]}</span>
    <div class="stp"><button data-gc="${g[0]}" data-d="-1">−</button><span class="v num">${gm[g[0]]||0}</span><button data-gc="${g[0]}" data-d="1">+</button></div></div>`).join('');
  return `<div class="card raised"><h2><span class="dotp"></span>Fixtures</h2>${fxh}</div>
  <div class="card"><h2><span class="dotp"></span>Game-Day Protocol</h2>
   <div class="seg">${['A','B','C'].map(k=>`<button class="${k===pk?'on':''}" data-pp="${k}">${k}</button>`).join('')}</div>
   <div class="disp" style="font-weight:700;font-size:1.05rem;text-transform:uppercase">${p.name}</div>
   <div class="sub" style="margin-bottom:8px">${p.eg}</div><div class="tl">${tl}</div></div>
  <div class="card"><h2><span class="dotp"></span>3-Phase Warm-Up · 25–30\u2032</h2>
   ${WARMUP3.map(w=>`<div class="kv"><span style="color:var(--ball);font-weight:700">${w[0]}</span></div><p class="sub" style="padding:4px 0 8px">${w[1]}</p>`).join('')}
   <p class="sub"><b>End ready, not tired.</b></p></div>
  <div class="card"><h2><span class="dotp"></span>Per-Game Goals</h2>${goals}
   <hr class="hr"><div class="sub" style="margin-bottom:8px">Post-game log · ${esc(gm.d)}${gm.opp?' vs '+esc(gm.opp):''}</div>${counters}</div>`;}
function lastPlayGame(){const ds=todayStr();const f=[...FIX].reverse().find(x=>x.role==='PLAY'&&x.d<=ds)||FIX[0];
  let g=st.games.find(x=>x.d===f.d);if(!g){g={d:f.d,opp:f.opp,box:0,oreb:0,seal:0,to:0,foul:0};st.games.push(g);}g.opp=f.opp;return g;}
function bindGame(){document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{app.proto=b.dataset.pp;render();});
  document.querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>{const ck=st.pchk[app.proto];const i=+b.dataset.pi;
    const x=ck.indexOf(i);x>=0?ck.splice(x,1):ck.push(i);save();render();});
  document.querySelectorAll('[data-gc]').forEach(b=>b.onclick=()=>{const g=lastPlayGame();const k=b.dataset.gc;
    g[k]=Math.max(0,(g[k]||0)+ +b.dataset.d);save('Game stat saved');render();});}

/* ---- TRACK ---- */
function sparkBW(){const e=st.bw.slice(-14);if(e.length<2)return'<p class="sub">Log 2+ weights for the trend line.</p>';
  const vs=e.map(x=>x.kg);let lo=Math.min(...vs,90.5),hi=Math.max(...vs,94.5);const W=320,H=84,pad=6;
  const X=i=>pad+i*(W-2*pad)/(e.length-1),Y=v=>H-pad-(v-lo)*(H-2*pad)/(hi-lo);
  const pts=e.map((x,i)=>X(i)+','+Y(x.kg)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Bodyweight trend">
   <line x1="0" x2="${W}" y1="${Y(91)}" y2="${Y(91)}" stroke="#39465A" stroke-dasharray="4 4"/>
   <line x1="0" x2="${W}" y1="${Y(94)}" y2="${Y(94)}" stroke="#39465A" stroke-dasharray="4 4"/>
   <polyline points="${pts}" fill="none" stroke="#FF7A2F" stroke-width="2.5" stroke-linejoin="round"/>
   ${e.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.kg)}" r="3" fill="#FF7A2F"/>`).join('')}</svg>
   <div class="sub num">last: <b>${vs[vs.length-1]} kg</b> · band 91–94 (dashed)</div>`;}
function vTrack(){const gs=st.gate.filter(g=>g.touched).slice(-7);
  const stiffRow=gs.map(g=>`<span class="setchip" title="${g.d}">${g.d.slice(8)}: <b>${g.stiff}</b></span>`).join(' ')||'<span class="sub">Use the morning gate daily — trend appears here.</span>';
  const wwRows=Object.keys(EX).filter(k=>EX[k].kg!=null).map(k=>`<tr><td>${esc(EX[k].n)}</td><td class="r num"><b>${wwFor(k)}</b> kg${st.ww[k]==null?' <span class="sub">(start)</span>':''}</td></tr>`).join('');
  const jr=st.jump.slice(-6).reverse().map(j=>`<div class="kv"><span>${fmtShort(j.d)}</span><b>${esc(j.note)}</b></div>`).join('')||'<p class="sub">Weekly: chalk-mark best touch, 3 fresh attempts, same shoes.</p>';
  const hist=st.logs.filter(l=>l.done).slice(-8).reverse().map(l=>`<div class="kv"><span>${fmtShort(l.d)}</span><b>${SESSIONS[l.s]?SESSIONS[l.s].title.split(' — ')[0]:l.s} ✓</b></div>`).join('')||'<p class="sub">Completed sessions land here.</p>';
  const p4=p4Alert();
  return `<div class="card raised"><h2><span class="dotp"></span>Bodyweight</h2>${sparkBW()}
    <div class="metricrow" style="margin-top:8px"><input type="number" step="0.1" id="bwIn2" placeholder="kg" inputmode="decimal"><button class="btn small" id="bwGo2">Log</button></div></div>
  <div class="card"><h2><span class="dotp"></span>Achilles AM Stiffness (P4)</h2>
    ${p4?`<div class="alertbar red">${p4}</div>`:''}<div class="sets">${stiffRow}</div></div>
  <div class="card"><h2><span class="dotp"></span>Jump — Backboard Chalk Mark</h2>${jr}
    <div class="metricrow" style="margin-top:8px"><input type="text" id="jIn" placeholder="e.g. mark #3 · +2 cm vs last wk"><button class="btn small" id="jGo">Log</button></div></div>
  <div class="card"><h2><span class="dotp"></span>Working Weights</h2><table class="tbl"><tbody>${wwRows}</tbody></table>
    <p class="sub" style="margin-top:6px">Auto-updates from your last logged set. HOLD until Jul 18; +2 kg rule from Jul 23.</p></div>
  <div class="card"><h2><span class="dotp"></span>Session History</h2>${hist}</div>`;}
function bindTrack(){const b=document.getElementById('bwGo2');if(b)b.onclick=()=>{const v=parseFloat(document.getElementById('bwIn2').value);
   if(!v||v<60||v>140)return toast('Enter a real kg value');st.bw=st.bw.filter(x=>x.d!==todayStr());st.bw.push({d:todayStr(),kg:v});st.bw.sort((a,b)=>a.d<b.d?-1:1);save('Weight logged');render();};
  const j=document.getElementById('jGo');if(j)j.onclick=()=>{const t=document.getElementById('jIn').value.trim();if(!t)return;
   st.jump.push({d:todayStr(),note:t.slice(0,60)});save('Jump logged');render();};}

/* ---- PLAYBOOK ---- */
function vBook(){return PB.map((s,i)=>`<div class="acc ${i===0?'open':''}"><button data-acc="${i}"><span>${esc(s.h)}</span><span class="car">▸</span></button><div class="body">${s.b}</div></div>`).join('');}
function bindBook(){document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));}

/* ---- timer ---- */
let tInt=null,tLeft=0;
function startTimer(sec){tLeft=sec;const el=document.getElementById('timer');el.classList.add('on');el.classList.remove('zero');tick();
  clearInterval(tInt);tInt=setInterval(()=>{tLeft--;tick();if(tLeft<=0){clearInterval(tInt);el.classList.add('zero');
   document.getElementById('tv').textContent='GO';if(navigator.vibrate)navigator.vibrate([180,80,180]);}},1000);}
function tick(){document.getElementById('tv').textContent=Math.floor(tLeft/60)+':'+P2(tLeft%60);}
document.querySelectorAll('#timer [data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
document.getElementById('tX').onclick=()=>{clearInterval(tInt);document.getElementById('timer').classList.remove('on');};

/* ---- render root ---- */
function render(){renderHead();const V=document.getElementById('view');
  if(app.tab==='today'){V.innerHTML=vToday();bindToday();}
  else if(app.tab==='train'){V.innerHTML=app.sess?vSession(app.sess):vTrainList();bindTrain();}
  else if(app.tab==='game'){V.innerHTML=vGame();bindGame();}
  else if(app.tab==='track'){V.innerHTML=vTrack();bindTrack();}
  else{V.innerHTML=vBook();bindBook();}
  window.scrollTo(0,0);}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  app.tab=b.dataset.tab;if(app.tab!=='train')app.sess=null;app.draft={};render();});

(async()=>{await loadState();render();setInterval(renderHead,30000);})();
</script>
<style>
/* ============ v3 FINAL additions ============ */
#scoreB{overflow:hidden}

<script>
/* ============ v3 FINAL module — physics lab, radar, charts, flow, calc ============ */
const G=9.81, RIM=305, DUNK=317, GMAX=16, TAU=4.5;
const hangT=cm=>2*Math.sqrt(2*(cm/100)/G);
const projGain=m=>GMAX*(1-Math.exp(-m/TAU));
function monthsTo(target,base){if(base>=target)return 0;for(let m=0;m<=24;m+=0.1){if(base+projGain(m)>=target)return Math.round(m*10)/10;}return null;}
function ensureV3(){st.dunk=st.dunk||{reach:255,vert:45};
 st.skN=st.skN||{post:5,fin:5,reb:5,def:5,seal:4,shoot:4};
 if(st.skP===undefined)st.skP=null;
 st.tipCustom=st.tipCustom||'20:15';}
const _render=render; render=function(){ensureV3();_render();};
if(navigator.standalone)document.body.classList.add('pwa');

/* ---- Dunk Lab ---- */
const Ycm=cm=>10+(332-cm)/(332-235)*228;   // gauge map 235–332cm → px
function dunkCard(){const d=st.dunk,touch=d.reach+d.vert,ht=hangT(d.vert);
 const mGrab=monthsTo(RIM,touch),mDunk=monthsTo(DUNK,touch);
 const gauge=`<svg viewBox="0 0 100 252" aria-label="Jump gauge">
  <line x1="18" x2="18" y1="${Ycm(235)}" y2="${Ycm(332)}" stroke="#39465A"/>
  ${[240,260,280,300,320].map(c=>`<line x1="14" x2="22" y1="${Ycm(c)}" y2="${Ycm(c)}" stroke="#39465A"/><text x="26" y="${Ycm(c)+3}" class="svgtxt" fill="#8A93A6" font-size="8">${c}</text>`).join('')}
  <line x1="10" x2="96" y1="${Ycm(RIM)}" y2="${Ycm(RIM)}" stroke="#FF7A2F" stroke-width="2"/>
  <text x="52" y="${Ycm(RIM)-4}" fill="#FF7A2F" font-size="9" font-weight="700">RIM 305</text>
  <line x1="10" x2="96" y1="${Ycm(DUNK)}" y2="${Ycm(DUNK)}" stroke="#E9B44C" stroke-dasharray="4 3"/>
  <text x="52" y="${Ycm(DUNK)-3}" fill="#E9B44C" font-size="8">DUNK 317</text>
  <line x1="40" x2="96" y1="${Ycm(d.reach)}" y2="${Ycm(d.reach)}" stroke="#8A93A6" stroke-dasharray="2 3"/>
  <text x="42" y="${Ycm(d.reach)+10}" fill="#8A93A6" font-size="8">reach ${d.reach}</text>
  <line x1="55" x2="83" y1="${Ycm(touch)}" y2="${Ycm(touch)}" stroke="#EDEDE6" stroke-width="2"/>
  <circle id="dkBall" cx="69" cy="${Ycm(d.reach)}" r="7" fill="#FF7A2F"/>
 </svg>`;
 const proj=(()=>{const lo=Math.min(touch,300)-3,hi=Math.max(touch+GMAX,DUNK)+3;
  const X=m=>12+m/24*280,Y=v=>108-(v-lo)/(hi-lo)*96;
  let pts='';for(let m=0;m<=24;m+=1){pts+=X(m)+','+Y(touch+projGain(m))+' ';}
  const mark=(m,col,lab)=>m==null?'':`<circle cx="${X(m)}" cy="${Y(m===0?touch:touch+projGain(m))}" r="3.5" fill="${col}"/><text x="${Math.min(X(m)+4,258)}" y="${Y(touch+projGain(m))-5}" fill="${col}" font-size="8.5" font-weight="700">${lab} ${m===0?'now':m+'mo'}</text>`;
  return `<svg viewBox="0 0 300 120" aria-label="Projection">
   <line x1="12" x2="292" y1="${Y(RIM)}" y2="${Y(RIM)}" stroke="#FF7A2F" stroke-width="1.5"/><text x="14" y="${Y(RIM)-3}" fill="#FF7A2F" font-size="8">RIM GRAB</text>
   <line x1="12" x2="292" y1="${Y(DUNK)}" y2="${Y(DUNK)}" stroke="#E9B44C" stroke-dasharray="4 3"/><text x="14" y="${Y(DUNK)-3}" fill="#E9B44C" font-size="8">DUNK</text>
   <polyline points="${pts}" fill="none" stroke="#EDEDE6" stroke-width="2"/>
   ${mark(mGrab,'#4CC38A','GRAB')}${mark(mDunk,'#E9B44C','DUNK')}
   ${[0,6,12,18,24].map(m=>`<text x="${X(m)-4}" y="118" fill="#8A93A6" font-size="8">${m}m</text>`).join('')}
  </svg>`})();
 const stp=(f,lab,val,unit)=>`<div class="stp"><button data-dk="${f}" data-d="-1">−</button><span class="v num">${val}</span><span class="u">${unit}</span><button data-dk="${f}" data-d="1">+</button></div><span class="dk-lab">${lab}</span>`;
 return `<div class="card raised"><h2><span class="dotp"></span>Dunk Lab — Physics Simulator</h2>
  <div class="dk-wrap"><div class="dk-g">${gauge}</div>
   <div class="dk-side">
    <div class="dk-lab">Max touch (run-up)</div><div class="dk-big num" style="color:var(--ball)">${touch} cm</div>
    <div class="dk-lab" style="margin-top:6px">Hang time · t=2√(2h/g)</div><div class="dk-big num">${ht.toFixed(2)} s</div>
    <div class="dk-row">${stp('reach','standing reach',d.reach,'cm')}</div>
    <div class="dk-row">${stp('vert','running vert',d.vert,'cm')}</div>
    <button class="btn primary small" id="dkJump">▲ Test Jump</button>
   </div></div>
  <div class="kv"><span>Rim grab (305) gap</span><b>${Math.max(0,RIM-touch)} cm ${mGrab!=null?'· proj '+(mGrab===0?'NOW ✓':mGrab+' mo'):'· >24 mo'}</b></div>
  <div class="kv"><span>One-hand dunk (317) gap</span><b>${Math.max(0,DUNK-touch)} cm ${mDunk!=null?'· proj '+(mDunk===0?'NOW ✓':mDunk+' mo'):'· >24 mo — raise base strength first'}</b></div>
  <div class="proj" style="margin-top:8px">${proj}</div>
  <p class="sub">Gain model: ${GMAX}·(1−e^(−m/${TAU})) — the honest +10–18 cm/yr band, tendon-gated by P4. Baseline both numbers on <b>Jul 23</b>.</p></div>`;}
function dkAnim(){const d=st.dunk,ball=document.getElementById('dkBall');if(!ball)return;
 const y0=Ycm(d.reach),y1=Ycm(d.reach+d.vert),T=hangT(d.vert)*1000;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){ball.setAttribute('cy',y1);return;}
 const t0=performance.now();(function f(t){const x=Math.min(1,(t-t0)/T);
  ball.setAttribute('cy',y0-(y0-y1)*4*x*(1-x));if(x<1)requestAnimationFrame(f);else if(navigator.vibrate)navigator.vibrate(60);})(t0);}

/* ---- Skill Radar ---- */
const SKAX=[['post','Post FW'],['fin','Finish'],['reb','Rebound'],['def','Int-D'],['seal','Seal'],['shoot','Shoot']];
function rPt(i,v){const a=(-90+i*60)*Math.PI/180;return[103+v/10*78*Math.cos(a),98+v/10*78*Math.sin(a)];}
function poly(vals){return SKAX.map((s,i)=>rPt(i,vals[s[0]]).map(n=>n.toFixed(1)).join(',')).join(' ');}
function radarCard(){const rings=[2,4,6,8,10].map(r=>`<polygon points="${poly({post:r,fin:r,reb:r,def:r,seal:r,shoot:r})}" fill="none" stroke="#39465A" stroke-width="${r===10?1.2:0.6}"/>`).join('');
 const axes=SKAX.map((s,i)=>{const[x,y]=rPt(i,10),[lx,ly]=rPt(i,12.3);
  return `<line x1="103" y1="98" x2="${x}" y2="${y}" stroke="#39465A" stroke-width=".6"/><text x="${lx}" y="${ly+3}" text-anchor="middle" fill="#8A93A6" font-size="9">${s[1]}</text>`;}).join('');
 const now=`<polygon points="${poly(st.skN)}" fill="rgba(255,122,47,.22)" stroke="#FF7A2F" stroke-width="2"/>`;
 const prev=st.skP?`<polygon points="${poly(st.skP.vals)}" fill="none" stroke="#EDEDE6" stroke-width="1.4" stroke-dasharray="4 3"/>`:'';
 const cells=SKAX.map(s=>`<div class="skcell"><div class="n">${s[1]}</div><div class="row"><button data-sk="${s[0]}" data-d="-1">−</button><span class="v num">${st.skN[s[0]]}</span><button data-sk="${s[0]}" data-d="1">+</button></div></div>`).join('');
 return `<div class="card"><h2><span class="dotp"></span>Skill Radar — the six targets</h2>
  <div class="radarbox"><svg viewBox="0 0 206 196">${rings}${axes}${prev}${now}</svg>
  <div class="skgrid">${cells}</div></div>
  <div class="btnrow" style="margin-top:10px"><button class="btn small" id="skSnap">Save monthly snapshot</button>
  ${st.skP?`<span class="chip">ghost: ${st.skP.d}</span>`:'<span class="sub">Snapshot monthly — the dashed ghost shows growth.</span>'}</div></div>`;}

/* ---- Load & health charts ---- */
function weekKey(ds){const d=parseL(ds);const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));return mon.getFullYear()+'-'+P2(mon.getMonth()+1)+'-'+P2(mon.getDate());}
function tonnage(){const m={};for(const l of st.logs){const wk=weekKey(l.d);let t=0;
  for(const id in l.ex)for(const s of l.ex[id])t+=(s[0]||0)*s[1];m[wk]=(m[wk]||0)+t;}
 return Object.entries(m).sort().slice(-6);}
function tonnageCard(){const w=tonnage();if(!w.length)return'';
 const max=Math.max(...w.map(x=>x[1]),1),BW=280/w.length;
 const bars=w.map((x,i)=>{const h=x[1]/max*80,X=12+i*BW;
  return `<rect x="${X+BW*0.15}" y="${96-h}" width="${BW*0.7}" height="${h}" fill="#FF7A2F" rx="3"/>
   <text x="${X+BW/2}" y="${92-h}" text-anchor="middle" fill="#EDEDE6" font-size="8.5" font-weight="700">${x[1]>=1000?(x[1]/1000).toFixed(1)+'t':x[1]}</text>
   <text x="${X+BW/2}" y="108" text-anchor="middle" fill="#8A93A6" font-size="8">${fmtShort(x[0]).slice(4)}</text>`;}).join('');
 return `<div class="card"><h2><span class="dotp"></span>Weekly Tonnage (kg lifted)</h2>
  <div class="wchart"><svg viewBox="0 0 300 112">${bars}</svg></div>
  <p class="sub">Auto-summed from logged sets. In-season: flat is correct. Build phase: gentle up-slope.</p></div>`;}
function stiffCard(){const gs=st.gate.filter(g=>g.touched).slice(-14);if(gs.length<2)return'';
 const X=i=>14+i*(276/Math.max(1,gs.length-1)),Y=v=>100-v*9;
 const pts=gs.map((g,i)=>X(i)+','+Y(g.stiff)).join(' ');
 return `<div class="card"><h2><span class="dotp"></span>Achilles Stiffness — 14-day line</h2>
  <div class="schart"><svg viewBox="0 0 300 112">
  <line x1="14" x2="290" y1="${Y(4)}" y2="${Y(4)}" stroke="#E5484D" stroke-dasharray="4 3"/>
  <text x="16" y="${Y(4)-4}" fill="#E5484D" font-size="8">P4 threshold</text>
  <polyline points="${pts}" fill="none" stroke="#EDEDE6" stroke-width="2"/>
  ${gs.map((g,i)=>`<circle cx="${X(i)}" cy="${Y(g.stiff)}" r="3" fill="${g.stiff>=4?'#E5484D':'#4CC38A'}"/>`).join('')}
  </svg></div></div>`;}
function heatCard(){let out='<div class="heat">';const cmap={green:'#4CC38A',amber:'#E9B44C',red:'#E5484D'};
 for(let i=20;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);
  const ds=d.getFullYear()+'-'+P2(d.getMonth()+1)+'-'+P2(d.getDate());
  const g=st.gate.find(x=>x.d===ds&&x.touched);
  out+=`<span title="${ds}" style="${g?'background:'+cmap[verdict(g)]:''}"></span>`;}
 return `<div class="card"><h2><span class="dotp"></span>Readiness — last 21 days</h2>${out}</div><p class="sub" style="margin:-6px 0 12px 2px">grey = gate not set that morning</p>`;}

/* ---- wrap Track ---- */
const _vTrack=vTrack, _bindTrack=bindTrack;
vTrack=function(){return dunkCard()+radarCard()+tonnageCard()+stiffCard()+heatCard()+_vTrack();};
bindTrack=function(){_bindTrack();
 document.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{const f=b.dataset.dk,d=+b.dataset.d;
  const lim=f==='reach'?[240,275]:[20,90];st.dunk[f]=Math.min(lim[1],Math.max(lim[0],st.dunk[f]+d));save('Saved');render();});
 const j=document.getElementById('dkJump');if(j)j.onclick=dkAnim;
 document.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const k=b.dataset.sk;
  st.skN[k]=Math.min(10,Math.max(1,st.skN[k]+ +b.dataset.d));save();render();});
 const s=document.getElementById('skSnap');if(s)s.onclick=()=>{st.skP={vals:Object.assign({},st.skN),d:todayStr()};save('Snapshot saved');render();};};

/* ---- Game: any-day protocol calculator ---- */
const _vGame=vGame,_bindGame=bindGame;
vGame=function(){const base=_vGame();const p=PROTO[app.proto];
 const tip=parseL(todayStr(),st.tipCustom);
 const rows=p.items.map(it=>`<div class="kv"><span>${it[1].split(':')[0].split('—')[0].slice(0,46)}</span><b class="num">${clock(new Date(tip.getTime()-it[0]*60000))}</b></div>`).join('');
 return base+`<div class="card"><h2><span class="dotp"></span>Any-Day Protocol Calculator</h2>
  <div class="dk-row"><input type="time" id="tipT" value="${st.tipCustom}"><span class="sub">custom tip-off → Protocol ${app.proto} clocks (outlives the July fixtures)</span></div>${rows}</div>`;};
bindGame=function(){_bindGame();const t=document.getElementById('tipT');
 if(t)t.onchange=()=>{if(/^\d{2}:\d{2}$/.test(t.value)){st.tipCustom=t.value;save('Tip time set');render();}};};

/* ---- Playbook: real flowchart replaces ASCII ---- */
const FLOW=`<div class="flow"><svg viewBox="0 0 330 268">
<defs><marker id="arw" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#8A93A6"/></marker></defs>
<polygon points="165,6 228,32 165,58 102,32" fill="#22160E" stroke="#FF7A2F"/>
<text x="165" y="30" text-anchor="middle">MORNING</text><text x="165" y="41" text-anchor="middle">GATE</text>
<rect x="6" y="15" width="72" height="34" rx="8" fill="#232D3D" stroke="#E5484D"/>
<text x="42" y="29" text-anchor="middle">REST /</text><text x="42" y="40" text-anchor="middle">skills-only</text>
<line x1="102" y1="32" x2="80" y2="32" class="ed" stroke="#8A93A6" marker-end="url(#arw)"/><text x="90" y="26" class="lbl" text-anchor="middle">RED</text>
<line x1="165" y1="58" x2="165" y2="76" class="ed" stroke="#8A93A6" marker-end="url(#arw)"/><text x="171" y="71" class="lbl">ok</text>
<polygon points="165,78 236,104 165,130 94,104" fill="#232D3D" stroke="#39465A"/>
<text x="165" y="100" text-anchor="middle">COURT open</text><text x="165" y="112" text-anchor="middle">+ owed?</text>
<rect x="252" y="87" width="70" height="34" rx="8" fill="#232D3D" stroke="#4CC38A"/><text x="287" y="108" text-anchor="middle">COURT</text>
<line x1="236" y1="104" x2="250" y2="104" class="ed" stroke="#8A93A6" marker-end="url(#arw)"/><text x="243" y="98" class="lbl" text-anchor="middle">Y</text>
<line x1="165" y1="130" x2="165" y2="148" class="ed" stroke="#8A93A6" marker-end="url(#arw)"/><text x="171" y="143" class="lbl">N</text>
<polygon points="165,150 236,176 165,202 94,176" fill="#232D3D" stroke="#39465A"/>
<text x="165" y="172" text-anchor="middle">STRENGTH</text><text x="165" y="184" text-anchor="middle">owed this wk?</text>
<rect x="252" y="159" width="70" height="34" rx="8" fill="#232D3D" stroke="#4CC38A"/><text x="287" y="180" text-anchor="middle">GYM A / B</text>
<line x1="236" y1="176" x2="250" y2="176" class="ed" stroke="#8A93A6" marker-end="url(#arw)"/><text x="243" y="170" class="lbl" text-anchor="middle">Y</text>
<line x1="165" y1="202" x2="165" y2="220" class="ed" stroke="#8A93A6" marker-end="url(#arw)"/><text x="171" y="215" class="lbl">N</text>
<rect x="88" y="222" width="154" height="34" rx="8" fill="#232D3D" stroke="#39465A"/>
<text x="165" y="236" text-anchor="middle">HOME · Daily-8 / mobility</text><text x="165" y="248" text-anchor="middle" class="lbl">else REST (earned)</text>
</svg></div>`;
{const de=PB.find(p=>p.h.startsWith('Daily decision'));if(de)de.b=FLOW+de.b.replace(/<div class="mono">[\s\S]*?<\/div>/,'');}
render();
</script>
<style>
/* ==== v3.1 — data safety & FT ==== */
.ta{width:100%;min-height:104px;background:var(--asphalt);border:1px solid var(--line);border-radius:10px;
 padding:10px;color:var(--chalk);font-family:ui-monospace,Menlo,monospace;font-size:.7rem;line-height:1.4;resize:vertical}
.mode{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.mode .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.mode.local .dot{background:var(--amber)}
.ftpct{font-family:'Barlow Condensed';font-weight:700;font-size:2rem;line-height:1}
</style>
<script>
/* ============ v3.1 module — verified storage, backup, flush, FT ============ */
const BUILD='FINAL r2 · 6 Jul 2026';

/* ---- runtime storage verification + graceful demotion ---- */
async function storeBoot(){if(MODE!=='claude')return;
 try{await window.storage.set(KEY+':p','1');
  const r=await window.storage.get(KEY+':p');
  if(!(r&&r.value==='1'))throw 0;
  try{await window.storage.delete(KEY+':p');}catch(_){}
 }catch(e){MODE='local';
  try{await loadState();}catch(_){}
  toast('Claude storage unreachable — using on-device storage');}}

/* ---- flush on hide: iOS suspends PWAs; don't trust the 700ms debounce ---- */
async function flushSave(){clearTimeout(saveT);try{await sSet(KEY,JSON.stringify(st));}catch(e){}}
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();});

/* ---- export / import ---- */
function validateImport(o){return !!(o&&typeof o==='object'&&Array.isArray(o.logs)&&Array.isArray(o.gate)&&Array.isArray(o.bw)&&o.ww&&typeof o.ww==='object');}
function stCounts(){return st.logs.filter(l=>l.done).length+' sessions · '+st.gate.filter(g=>g.touched).length+' gates · '+st.bw.length+' weigh-ins · '+(st.ft?st.ft.length:0)+' FT logs';}
let impArm=false;
function dataCard(){return `<div class="card raised"><h2><span class="dotp"></span>Data & Sync</h2>
 <div class="kv"><span>Storage mode</span><b><span class="mode ${MODE==='local'?'local':''}"><span class="dot"></span>${MODE==='claude'?'Claude account (synced)':'This device (localStorage)'}</span></b></div>
 <div class="kv"><span>Holdings</span><b>${stCounts()}</b></div>
 <div class="kv"><span>Build</span><b>${BUILD}</b></div>
 <div class="btnrow" style="margin:10px 0 8px"><button class="btn small" id="expB">Export backup</button>
  <button class="btn small ghost" id="expCp" style="display:none">Copy</button></div>
 <textarea class="ta" id="expTa" readonly style="display:none" aria-label="Export JSON"></textarea>
 <hr class="hr"><div class="sub" style="margin-bottom:6px">Import: paste a backup below. Two-tap overwrite guard.</div>
 <textarea class="ta" id="impTa" placeholder='{"v":2, ...}' aria-label="Import JSON"></textarea>
 <button class="btn small block ${impArm?'primary':''}" id="impB" style="margin-top:8px">${impArm?'Tap again to OVERWRITE current data':'Import backup'}</button>
 <p class="sub" style="margin-top:8px">Export before the Jul 23 baselines, and whenever you switch homes (Claude ↔ self-host) — paste-import carries everything across.</p></div>`;}
function bindData(){const eb=document.getElementById('expB');if(eb)eb.onclick=()=>{const ta=document.getElementById('expTa');
  ta.value=JSON.stringify(st);ta.style.display='block';document.getElementById('expCp').style.display='inline-flex';
  ta.focus();ta.select();};
 const cp=document.getElementById('expCp');if(cp)cp.onclick=async()=>{const ta=document.getElementById('expTa');
  try{await navigator.clipboard.writeText(ta.value);toast('Copied to clipboard');}
  catch(e){ta.focus();ta.select();try{document.execCommand('copy');toast('Copied');}catch(_){toast('Select-all and copy manually');}}};
 const ib=document.getElementById('impB');if(ib)ib.onclick=()=>{const raw=document.getElementById('impTa').value.trim();
  if(!raw)return toast('Paste a backup first');

const icoSVG=n=>'<svg viewBox="0 0 24 24">'+(ICO[n]||ICO.ball)+'</svg>';
const dsOf=d=>d.getFullYear()+'-'+P2(d.getMonth()+1)+'-'+P2(d.getDate());

/* hero — the one-glance answer: what today is, am I cleared, when is the next tip */
function heroCard(){const ds=todayStr(),a=assignFor(ds),fx=fixOn(ds),m=KMETA[a.k]||KMETA.PRE;
 const g=todayGate(),v=g.touched?verdict(g):null,d=parseL(ds);
 const phase=ds<'2026-07-19'?'IN-SEASON':(ds<=TRANS_END?'TRANSITION':'BUILD');
 const titl=a.k==='GAME'?a.t:a.t.split('—')[0].trim();
 let cta='';
 if(a.k==='GAME'&&fx)cta=`<button class="btn acbtn block" data-go="proto" data-p="${fx.proto}">Open Protocol ${fx.proto} · tip ${clock(parseL(fx.d,fx.tip))}</button>`;
 else if(SESSIONS[a.k])cta=`<button class="btn acbtn block" data-go="sess" data-s="${a.k}">Start ${SESSIONS[a.k].title.split(' — ')[0]} →</button>`;
 else if(a.k==='FLOAT')cta=`<div class="btnrow" style="justify-content:center"><button class="btn" data-go="sess" data-s="C1">Court 1</button><button class="btn" data-go="sess" data-s="C2">Court 2</button><button class="btn ghost" data-go="sess" data-s="MOB">Mobility</button></div>`;
 else cta=`<button class="btn block" data-go="sess" data-s="MOB">Open Mobility →</button>`;
 const nt=nextTip();
 const tipChip=nt?`<span class="chip">NEXT TIP · ${nt.f.d===ds?'TODAY':fmtShort(nt.f.d)} · ${clock(nt.t)}</span>`:'';
 const vchip=v?`<span class="vpill ${v}">${v.toUpperCase()}${v==='green'?' · CLEARED':v==='amber'?' · DOWNGRADE':' · PROTECT'}</span>`
             :'<span class="vpill grey">SET MORNING GATE ↓</span>';
 const warn=(v&&v!=='green'&&SESSIONS[a.k])?`<div class="alertbar ${v==='red'?'red':'amber'}" style="text-align:left">${VTXT[v][1]}</div>`:'';
 return `<section class="card raised hero" style="--ac:${m.c};--acg:${m.g}">
  <div class="h-eyebrow">${phase} · ${DW[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}</div>
  <div class="h-icw">${icoSVG(m.i)}</div>
  <h1 class="h-title">${esc(titl)}</h1>
  <p class="h-sub">${esc(a.s)}</p>
  <div class="h-chips">${vchip}${tipChip}</div>${warn}${cta}</section>`;}

/* 7-day colour-coded strip (yesterday + 6 ahead) */
function weekStrip(){const t=parseL(todayStr());let out='<div class="wk7" id="wk7" role="button" aria-label="Open block calendar">';
 for(let i=-1;i<6;i++){const d=new Date(t);d.setDate(t.getDate()+i);const ds=dsOf(d);
  const a=assignFor(ds),m=KMETA[a.k]||KMETA.PRE;
  const done=st.logs.some(l=>l.d===ds&&l.done);
  out+=`<div class="wd ${i===0?'now':''}" style="--ac:${m.c};--acg:${m.g}">
   <span class="dw">${DW[d.getDay()]}</span><span class="dn num">${d.getDate()}</span><span class="dot"></span>${done?'<span class="ok">✓</span>':''}</div>`;}
 return out+'</div>';}

/* morning gate — apple-style activity rings (outer sleep, mid soreness, inner achilles) */
function ringSVG(g){const M=[[Math.min(1,g.sleep/9),'#5AC8FA'],[(10-g.sore)/10,'#4CC38A'],[(10-g.stiff)/10,'#FF7A2F']];
 let s='';M.forEach((m,i)=>{const r=48-i*14,c=+(2*Math.PI*r).toFixed(1),off=+(c*(1-Math.max(0,Math.min(1,m[0])))).toFixed(1);
  s+=`<circle cx="57" cy="57" r="${r}" stroke="rgba(255,255,255,.07)" stroke-width="11" fill="none"/>
   <circle class="arc" cx="57" cy="57" r="${r}" stroke="${m[1]}" stroke-width="11" fill="none" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${off}" style="--c:${c};--o:${off}" transform="rotate(-90 57 57)"/>`;});
 return `<svg class="gring" viewBox="0 0 114 114" aria-label="Readiness rings">${s}</svg>`;}
function gateCard5(){const g=todayGate(),v=g.touched?verdict(g):null;
 const row=(k,lab,col)=>`<div class="g5row"><span class="lab" style="color:${col}">${lab}</span>
  <button data-g="${k}" data-d="-1">−</button><span class="val num">${g[k]}</span><button data-g="${k}" data-d="1">+</button></div>`;
 return `<div class="card gate"><h2><span class="dotp"></span>Morning Gate
  <span class="g-lights ${v||''}"><span></span><span></span><span></span></span></h2>
  <div class="g5"><div class="${g.touched?'':'gdim'}">${ringSVG(g)}</div><div class="g5r">
  ${row('sleep','Sleep h','#5AC8FA')}${row('sore','Soreness /10','#4CC38A')}${row('stiff','Achilles AM /10','#FF7A2F')}</div></div>
  ${v?`<div class="g-verdict ${v}" style="margin-top:12px"><div class="vt">${VTXT[v][0]}</div><div class="sub" style="color:inherit;opacity:.85">${VTXT[v][1]}</div></div>`
     :'<div class="sub" style="margin-top:10px">Set the three numbers — the rings fill and the verdict gates today’s session.</div>'}</div>`;}

/* daily-8 + bodyweight in one compact card */
function quickCard(){const last=st.bw.length?st.bw[st.bw.length-1]:null;
 return `<div class="card"><h2><span class="dotp" style="background:#F06A9C"></span>Daily-8 + Quick Log</h2>
  <div class="donebar"><button class="chk ${d8Today()?'on':''}" id="d8chk">✓</button>
   <span class="sub">Daily-8 ankle/core · 8 min ${d8Today()?'· <b style=&quot;color:var(--green)&quot;>done</b>':'· 3–5×/wk'}</span>
   <button class="btn small ghost" data-go="sess" data-s="D8" style="margin-left:auto">Open</button></div>
  <hr class="hr">
  <div class="metricrow"><input type="number" step="0.1" id="bwIn" placeholder="${last?last.kg:'91.5'}" inputmode="decimal">
   <span class="sub">kg · band 91–94${last?' · last <b class="num">'+last.kg+'</b>':''}</span>
   <button class="btn small" id="bwGo" style="margin-left:auto">Log</button></div></div>`;}

/* new Today assembly (banners preserved from v3.2/3.3) */
vToday=function(){const p4=p4Alert();
 return ctxBanner()+backupBanner()+(p4?`<div class="alertbar red">${p4}</div>`:'')
  +heroCard()+weekStrip()+gateCard5()+quickCard();};
const _bt5=bindToday;bindToday=function(){_bt5();
 const w=document.getElementById('wk7');if(w)w.onclick=()=>{app.tab='train';app.sess=null;render();};};

/* Train list — icon tiles + accent colours */
vTrainList=function(){const cards=['A','B','C1','C2','MOB','D8'].map(k=>{const s=SESSIONS[k],m=KMETA[k];
 const parts=s.title.split(' — ');
 return `<div class="card" style="--ac:${m.c};--acg:${m.g}"><div class="strow"><div class="sic">${icoSVG(m.i)}</div>
  <div style="flex:1;min-width:0"><div class="disp" style="font-size:1.12rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em">${esc(parts[0])}</div>
  <div class="sub">${esc(parts[1]||'')}${parts[1]?' · ':''}${esc(s.time)}</div></div>
  <button class="btn small acc" data-open="${k}">Open</button></div></div>`;}).join('');
 return `<div class="card raised"><h2><span class="dotp"></span>Block Calendar</h2>${calHTML()}</div>${cards}`;};

/* calendar — colour-coded left rails */
calHTML=function(){const ds=todayStr();let out='<div class="cal">';
 for(const d of Object.keys(CAL)){const a=CAL[d],dd=parseL(d),m=KMETA[a.k]||KMETA.PRE;
  const done=st.logs.some(l=>l.d===d&&l.done);
  out+=`<div class="day ${d===ds?'today':''} ${a.k==='GAME'?'game':''}" style="--ac:${m.c}">
   <div class="dd"><div class="dnum num">${dd.getDate()}</div><div class="dw">${DW[dd.getDay()]}</div></div>
   <div class="dl"><div class="t">${esc(a.t)}</div><div class="s">${esc(a.s)}</div></div>
   ${done?'<div class="done">✓</div>':''}</div>`;}
 return out+`</div><p class="sub" style="margin-top:8px">From <b>Jul 23</b> the calendar switches to the BUILD weekly template (see Playbook → Phases).</p>`;};

/* session view inherits its accent colour */
const _vS5=vSession;vSession=function(k){const m=KMETA[k]||KMETA.A;
 return `<div class="sesswrap" style="--ac:${m.c};--acg:${m.g}">${_vS5(k)}</div>`;};

/* fix: bottom nav now follows programmatic navigation (hero CTA, week strip, quick links) */
function syncTabs(){document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===app.tab));}
const _r5=render;render=function(){_r5();syncTabs();};

const _dc5=dataCard;dataCard=function(){return _dc5().replace('FINAL r4 · LIQUID GLASS','FINAL r5 · GLASS DASHBOARD');};
render();
</script>
<style>
/* ============ v5.1 — HIG COMPLIANCE PASS ============ */
/* Apple HIG: 44×44pt minimum hit targets (fat-finger reliability) */
.g5row button{width:42px;height:42px}
.skcell button{width:38px;height:38px}
.stp button{width:42px;height:44px}
.stp .v{min-width:48px}
.g-cell .step button{width:40px;height:40px}
.chk{width:32px;height:32px;border-radius:10px}
.btn.small{min-height:40px}
#tabs button .ic{margin-top:2px}
/* HIG: no text below ~11pt — raise every micro-caption */
.wk7 .dw{font-size:.69rem}
.cal .dd .dw{font-size:.69rem}
.h-eyebrow{font-size:.69rem}
.g5row .lab{font-size:.64rem}
.skcell .n{font-size:.69rem}
.dk-lab{font-size:.66rem}
.tbl th{font-size:.66rem}
#scoreB .tip .t1{font-size:.66rem}
#timer .tl2{font-size:.66rem}
.grp .gt{font-size:.68rem}
.g-cell label{font-size:.64rem}
.stp .u{font-size:.66rem}
/* Goal-Gradient: session progress bar */
.sprog{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.spb{flex:1;height:10px;border-radius:999px;background:rgba(16,21,29,.7);
 border:1px solid rgba(255,255,255,.07);overflow:hidden}
.spf{height:100%;border-radius:999px;min-width:0;
 background:linear-gradient(90deg,var(--ac,#FF7A2F),color-mix(in srgb,var(--ac,#FF7A2F) 70%,#fff));
 box-shadow:0 0 10px -2px var(--acg,transparent);transition:width .45s cubic-bezier(.22,1,.36,1)}
.sprog.full .spf{background:linear-gradient(90deg,#3FB37F,#63E0A5)}
.spt{font-size:.72rem;color:var(--ink);font-weight:600;min-width:80px;text-align:right}
.sprog.full .spt{color:var(--green);font-weight:700}
</style>
<script>
/* ============ v5.1 module — goal-gradient, a11y, status visibility ============ */
/* session progress: logged sets + checked drills vs plan */
function sessProgress(k){const s=SESSIONS[k];const log=st.logs.find(l=>l.d===todayStr()&&l.s===k);
 let done=0,tot=0;
 if(s.groups)for(const g of s.groups)for(const id of g.items){const m=EX[id].t.match(/^(\d+)/);const n=m?+m[1]:3;
  tot+=n;done+=Math.min(n,((log&&log.ex[id])||[]).length);}
 if(s.drills){tot+=s.drills.length;if(log)done+=Object.values(log.dr).filter(Boolean).length;}
 return{done,tot,pct:tot?Math.round(done/tot*100):0};}
const _vS6=vSession;
vSession=function(k){const p=sessProgress(k);
 const bar=`<div class="sprog ${p.pct>=100?'full':''}" role="progressbar" aria-valuenow="${p.pct}" aria-valuemin="0" aria-valuemax="100">
  <div class="spb"><div class="spf" style="width:${p.pct}%"></div></div>
  <span class="spt num">${p.pct>=100?'Complete ✓':p.done+' / '+p.tot+' · '+p.pct+'%'}</span></div>`;
 return _vS6(k).replace(/(<span class="chip on">[^<]*<\/span><\/div>)/,'$1'+bar);};

/* status visibility: tell the athlete the app still works offline */
window.addEventListener('offline',()=>toast('Offline — everything still works, logs save on-device'));
window.addEventListener('online',()=>toast('Back online'));

/* VoiceOver: label every stepper, expose toggle state, mark the active tab */
const _r6=render;
render=function(){_r6();
 document.querySelectorAll('button[data-d]').forEach(b=>{if(!b.hasAttribute('aria-label'))
  b.setAttribute('aria-label',(+b.dataset.d<0?'Decrease':'Increase'));});
 document.querySelectorAll('button.chk').forEach(b=>{b.setAttribute('aria-pressed',b.classList.contains('on'));
  if(!b.hasAttribute('aria-label'))b.setAttribute('aria-label','Mark done');});
 document.querySelectorAll('#tabs button').forEach(x=>x.classList.contains('on')
  ?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'));};

const _dc6=dataCard;dataCard=function(){return _dc6().replace('FINAL r5 · GLASS DASHBOARD','V5 · GLASS · HIG PASS');};
render();
</script>
